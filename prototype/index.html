let SUB_F='all', SUB_Q='';
function subRows(){ return SUBMISSIONS.filter(s=>(SUB_F==='all'||(SUB_F==='flagged'?s[6]!=='—':s[4]===SUB_F))&&(!SUB_Q||s.join(' ').toLowerCase().includes(SUB_Q.toLowerCase()))).map(s=>`<tr ${s[6]!=='—'?'style="background:rgba(217,154,30,.04)"':''}><td class="mono xs">${s[0]}</td><td class="small"><b>${s[1]}</b></td><td class="small mono muted">@${s[2]}</td><td class="small">${s[3]}</td><td class="mono xs muted">CIPHERARENA{${'•'.repeat(8)}} <button class="btn ghost sm" style="height:20px;padding:0 5px" onclick="revealDlg()">${ic('eye',12)}</button></td><td>${resBadge(s[4])}</td><td class="mono xs muted hide-m">${s[5]}</td><td>${s[6]==='dup'?`<a href="#anticheat">${badge(ic('alert',11)+'Duplicate dynamic flag','serious')}</a>`:s[6]==='rate'?`<a href="#anticheat">${badge(ic('clock',11)+'Burst rate','warn')}</a>`:'<span class="dim xs">—</span>'}</td></tr>`).join('')||`<tr><td colspan="8">${empty('filter','No submissions match','Adjust the filters.')}</td></tr>`; }
function revealDlg(){ confirmDlg('Reveal submitted value?','Viewing raw submissions is logged in the audit trail with your username. Only do this when investigating an incident.','Reveal & log',()=>toast('Raw value: CIPHERARENA{gr4phql_3e8a1c07f9b2} — access logged','warn','eye'),false); }
R.submissions=O_({title:'Submissions',crumbs:()=>[['IronVeil CTF 2026','org-home'],['Submissions']],render:()=>pageH('Submission monitoring','Live feed · 38,214 total · values masked by default',`<span class="badge live"><span class="dot pulse"></span>Streaming (simulated)</span>`+btn('Export',{cls:'outline sm',ic:'download',on:'exportDlg()'}))+
  `<div class="grid g-4 keep2 mb4">${stat('Last hour','1,412','+8% vs prev.')}${stat('Correct rate','25.8%')}${stat('Rate-limited','214','last hour')}${stat('Flagged','3','2 open incidents')}</div>
  <div class="card"><div class="row wrap g3" style="padding:12px 14px;border-bottom:1px solid var(--border)"><div style="width:280px;max-width:100%">${searchBox('Team, user, challenge or IP',SUB_Q,'oninput="SUB_Q=this.value;document.getElementById(\'subt\').innerHTML=subRows()"')}</div>${seg([['all','All'],['correct','Correct'],['incorrect','Incorrect'],['flagged','Flagged']],SUB_F,"(v=>{SUB_F=v;render()})")}<div class="grow"></div><span class="xs muted">${ic('info',12)} IP metadata collected under the event privacy notice; retained 30 days.</span></div>

/* ---------- Anti-cheat ---------- */
function incStatus(i){ return S.incStatus[i.id]||i.status; }
const stBadge=s=>({Open:badge('Open','live'),Investigating:badge('Investigating','warn'),Dismissed:badge('Dismissed'),'Action taken':badge('Action taken','info'),'Confirmed':badge('Confirmed','serious')}[s]||badge(s));
R.anticheat=O_({title:'Anti-Cheat',crumbs:()=>[['IronVeil CTF 2026','org-home'],['Anti-Cheat Center']],render(p){
  if(p) S.incSel=p;
  const inc=INCIDENTS.find(i=>i.id===S.incSel)||INCIDENTS[0]; const notes=S.incNotes[inc.id]||[];
  return pageH('Anti-Cheat Center','Risk signals for organizer review. Signals are not proof of cheating — investigate before acting.',btn('Detection settings',{cls:'outline',ic:'sliders',on:'detDlg()'}))+
  `<div class="grid g-4 keep2 mb4">${stat('Open signals',INCIDENTS.filter(i=>incStatus(i)==='Open').length,'','alert')}${stat('Investigating',INCIDENTS.filter(i=>incStatus(i)==='Investigating').length,'','eye')}${stat('Resolved (24h)','2','1 dismissed · 1 action','check')}${stat('False-positive rate','38%','last 3 events','activity')}</div>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start" id="acg"><div class="card"><div class="card-h"><h3>Signals</h3><span class="xs muted">${INCIDENTS.length} total</span></div>${INCIDENTS.map(i=>`<div onclick="S.incSel='${i.id}';render()" style="padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;${i.id===inc.id?'background:var(--surface-2);box-shadow:inset 2px 0 0 var(--crimson-2)':''}"><div class="row between">${sevTag(i.sev)}${stBadge(incStatus(i))}</div><div class="small mt1" style="font-weight:500">${i.title}</div><div class="xs muted mt1"><span class="mono">${i.id}</span> · ${i.src} · ${i.time}</div></div>`).join('')}</div>
  <div class="card"><div class="card-h"><div><div class="row">${sevTag(inc.sev)}<span class="mono xs muted">${inc.id}</span></div><h3 class="h3 mt1">${inc.title}</h3></div>${stBadge(incStatus(inc))}</div><div class="card-b col g4">
  <dl class="kv"><dt>Detection source</dt><dd>${inc.src} · model confidence <span class="mono">${inc.conf}</span></dd><dt>Related teams</dt><dd class="row wrap">${inc.teams.map(t=>`<a href="#tp-${t.replace(/\W+/g,'-').toLowerCase()}">${badge(t)}</a>`).join('')}</dd><dt>Challenge</dt><dd>${inc.chal}</dd><dt>Detected</dt><dd>${inc.time}</dd></dl>
  <div><div class="lbl-f mb2">Evidence</div><div class="col g2">${inc.evidence.map(e=>`<div class="row g3 start small t2" style="padding:8px 10px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r)">${ic('file',14,'muted')}<span>${e}</span></div>`).join('')}</div></div>
  <div class="alert info">${ic('info')}<div class="small">This is a <b>risk signal</b>, not a verdict. Shared lab networks, VPNs and coincidence can produce similar patterns. Contact the team before applying penalties.</div></div>
  <div><div class="lbl-f mb2">Investigation history</div><div class="timeline">${[...inc.history,...notes.map(n=>[n.t,'Note (mira_o): '+n.x])].map((h,k,a)=>`<div class="ti ${k===a.length-1?'on':''}"><div class="small">${esc(h[1])}</div><div class="xs dim mono">${h[0]}</div></div>`).join('')}</div></div>
  <div class="field"><label>Organizer notes</label><textarea class="textarea" id="incnote" style="min-height:70px" placeholder="Add context for co-organizers. Notes are private and logged."></textarea><div class="row">${btn('Add note',{cls:'outline sm',on:`addIncNote('${inc.id}')`})}</div></div>
  <div class="divider" style="margin:0"></div><div class="row wrap">${btn('Mark investigating',{cls:'outline sm',on:`setInc('${inc.id}','Investigating')`,ic:'eye'})}${btn('Dismiss',{cls:'outline sm',on:`setInc('${inc.id}','Dismissed')`,ic:'x'})}${btn('Contact teams',{cls:'outline sm',on:"toast('Message drafted to team captains (demo)','info','mail')",ic:'mail'})}<div class="grow"></div>${btn('Take action…',{cls:'primary sm',on:`actionDlg('${inc.id}')`,ic:'shield'})}</div></div></div></div>`;
}, mount(){ const g=document.getElementById('acg'); if(g&&innerWidth<1000) g.style.gridTemplateColumns='1fr'; }});
function setInc(id,s){ S.incStatus[id]=s; const i=INCIDENTS.find(x=>x.id===id); i.history=[...i.history,[nowUTC().slice(8),'Status → '+s+' (mira_o)']]; render(); toast(`${id} marked ${s.toLowerCase()}`,'info'); }
function addIncNote(id){ const v=document.getElementById('incnote').value.trim(); if(!v) return; (S.incNotes[id]=S.incNotes[id]||[]).push({t:nowUTC().slice(8),x:v}); render(); toast('Note added'); }
function actionDlg(id){ const i=INCIDENTS.find(x=>x.id===id); modal(`Take action · ${id}`,`<div class="col g4"><div class="alert warn">${ic('alert')}<div class="small">Actions are logged, visible to co-organizers and can be appealed by the affected teams.</div></div><div class="col">${[['Warn teams','Send a formal warning. No score change.'],['Revoke challenge points','Remove points for '+i.chal+' from affected teams.'],['Rotate flag','Generate new flags and redeploy instances.'],['Disqualify team(s)','Remove from ranked scoreboard. Requires a second organizer to confirm.']].map((a,k)=>`<div class="opt-card ${k===0?'on':''}" onclick="this.parentElement.querySelectorAll('.opt-card').forEach(x=>x.classList.remove('on'));this.classList.add('on')"><span class="rd"></span><div><b class="small">${a[0]}</b><div class="xs muted">${a[1]}</div></div></div>`).join('')}</div>${field('Reason (sent to teams)','<textarea class="textarea">Our review found identical team-specific flags submitted by both teams.</textarea>')}</div>`,btn('Cancel',{cls:'ghost',on:'closeModal()'})+btn('Confirm action',{cls:'primary',on:`closeModal();setInc('${id}','Action taken')`})); }

/* ---------- Design system ---------- */
R.system={shell:'public',title:'Design system',render:()=>{
  const sw=[['--bg','#0a0a0c','Background'],['--bg-2','#0f0f12','Background 2'],['--surface','#141418','Surface'],['--surface-2','#1a1a1f','Surface 2'],['--border','#24242a','Border'],['--border-2','#303038','Border strong'],['--text','#f1f1f3','Text'],['--muted','#8e8e98','Muted text'],['--crimson','#b0102c','Crimson (primary)'],['--crimson-2','#c8173a','Crimson hover / accent'],['--neon','#ff2e52','Neon red (sparingly)'],['--ok','#2fb36d','Success'],['--warn','#d99a1e','Warning'],['--serious','#e0662a','Serious'],['--info','#5b8def','Info']];
  return `<div class="wrapx" style="padding:40px 24px 72px">${pageH('Design system','CipherArena brand, tokens and reusable components. Everything in the prototype is built from these.')}
  <div class="grid g-2 mb4"><div class="card pad"><div class="eyebrow mb3">Brand</div><div class="row g4">${LOGO_MARK(64)}<div><div style="font-size:28px;font-weight:600;letter-spacing:-.02em">Cipher<span style="color:var(--crimson-2)">Arena</span></div><div class="mono small muted">Compete. Exploit. Learn. Conquer.</div></div></div><p class="small muted mt4">The mark is an “A” cut like a stencil with a horizontal scan line — an arena seen through a cipher. Use on dark backgrounds only. Crimson for emphasis, never for large fills.</p></div>
  <div class="card pad"><div class="eyebrow mb3">Principles</div><ol class="small t2 col g2" style="padding-left:18px"><li>Dense, readable data first; decoration last.</li><li>Crimson marks action & live state. Neon red is reserved for first blood and live pulses.</li><li>Monospace for flags, identifiers, numbers in tables and terminal output.</li><li>Status colors are reserved and always paired with icon + label.</li><li>4px spacing grid, 3–8px radii, 1px borders, no glows.</li></ol></div></div>
  <div class="card pad mb4"><div class="eyebrow mb3">Color tokens</div><div class="grid g-5 keep2">${sw.map(s=>`<div><div class="swatch" style="background:${s[1]}"></div><div class="small mt2">${s[2]}</div><div class="xs mono muted">${s[0]} · ${s[1]}</div></div>`).join('')}</div></div>
  <div class="grid g-2 mb4"><div class="card pad"><div class="eyebrow mb3">Typography — IBM Plex Sans / JetBrains Mono</div><div class="h-display" style="font-size:40px">Display 56/600</div><div class="h1 mt3">Heading 1 · 28/600</div><div class="h2 mt2">Heading 2 · 22/600</div><div class="h3 mt2">Heading 3 · 17/600</div><p class="mt2">Body 14/400 — Discover cybersecurity competitions and compete worldwide.</p><p class="small muted">Small 12 · muted</p><div class="mono mt3">CIPHERARENA{example_flag}</div><div class="eyebrow mt3">Eyebrow · mono 11 caps</div></div>
  <div class="card pad"><div class="eyebrow mb3">Spacing & radius</div><div class="col g2">${[4,8,12,16,24,32,48,64].map(s=>`<div class="row g3"><span class="mono xs muted" style="width:40px">${s}px</span><div style="height:10px;width:${s*3}px;background:var(--crimson-3);border-radius:2px"></div></div>`).join('')}</div><div class="row g4 mt4">${[['sm',3],['base',5],['lg',8]].map(r=>`<div style="width:64px;height:44px;border:1px solid var(--border-3);border-radius:${r[1]}px;display:flex;align-items:center;justify-content:center" class="xs mono muted">${r[0]} ${r[1]}</div>`).join('')}</div></div></div>
  <div class="card pad mb4"><div class="eyebrow mb3">Buttons</div><div class="row wrap g3">${btn('Primary',{cls:'primary'})}${btn('Secondary')}${btn('Outline',{cls:'outline'})}${btn('Ghost',{cls:'ghost'})}${btn('Danger',{cls:'danger'})}${btn('With icon',{cls:'primary',ic:'flag'})}${btn('',{cls:'icon outline',ic:'gear',attr:'aria-label="Icon button"'})}${btn('Small',{cls:'sm outline'})}${btn('Large',{cls:'lg primary'})}${btn('Disabled',{attr:'disabled'})}<button class="btn primary"><span class="spin"></span>Loading</button></div></div>
  <div class="grid g-2 mb4"><div class="card pad"><div class="eyebrow mb3">Forms</div><div class="col g4">${field('Text input',inp('','Placeholder'),'Helper text')}${field('Flag input','<input class="input flag-input" placeholder="CIPHERARENA{...}">')}<div class="field"><label>Error state</label><input class="input invalid" value="bad@"><span class="err">Enter a valid email address.</span></div>${field('Select',sel(['Option A','Option B']))}<div class="row g6"><label class="check"><input type="checkbox" checked><span class="small">Checkbox</span></label><span class="row small">${toggle(true)}Toggle</span></div>${seg([['a','Segmented'],['b','Control']],'a','(()=>0)')}<div class="row wrap" style="gap:6px"><button class="chip on">${ic('check',12)}Chip on</button><button class="chip">Chip</button></div></div></div>
  <div class="card pad"><div class="eyebrow mb3">Status & badges</div><div class="row wrap" style="gap:6px">${statusBadge('live')}${statusBadge('upcoming')}${statusBadge('completed')}${statusBadge('draft')}${badge('Success','ok')}${badge('Warning','warn')}${badge('Serious','serious')}${badge('Info','info')}${badge('Solid','solid')}${catTag('web')}${catTag('pwn')}${fbTag()}</div><div class="row g6 mt4">${['critical','high','medium','low'].map(sevTag).join('')}</div><div class="row g4 mt4">${[1,2,3,4,5].map(d=>diffBars(d)).join('')}</div>
  <div class="eyebrow mt6 mb3">Alerts</div><div class="col g2"><div class="alert ok">${ic('check')}<div>Success alert</div></div><div class="alert err">${ic('x')}<div>Error alert</div></div><div class="alert warn">${ic('alert')}<div>Warning alert</div></div><div class="alert info">${ic('info')}<div>Info alert</div></div></div></div></div>
  <div class="card pad mb4"><div class="eyebrow mb3">Flag submission feedback states</div><div class="grid g-5 keep2">${[['correct','check','Correct flag!','+250 points'],['incorrect','x','Incorrect flag','Attempts are logged'],['already','info','Already solved','No change'],['unavail','lock','Unavailable','Disabled by organizers'],['rate','clock','Rate limited','Retry in 30s']].map(s=>`<div class="fb-state ${s[0]}">${ic(s[1],18)}<div><b class="small">${s[2]}</b><div class="xs t2">${s[3]}</div></div></div>`).join('')}</div></div>
  <div class="grid g-3 mb4"><div><div class="eyebrow mb3">Challenge cards</div><div class="grid g-2" style="gap:8px">${chCard(CH.w2)}${chCard(CH.w3)}${chCard(CH.m3)}${chCard(CH.c2)}</div></div><div><div class="eyebrow mb3">Event card</div>${eventCard(EVT['nightshift-quals'])}</div><div><div class="eyebrow mb3">Team card · stat · skeleton</div><div class="card row g3" style="padding:14px">${av('Segfault Syndicate','lg')}<div><b class="small">Segfault Syndicate</b><div class="xs muted">#7 · 5,810 pts · 3 members</div></div></div><div class="mt3">${stat('Challenges solved','187','+9 this week','check',true)}</div><div class="card pad mt3 col g2"><div class="sk" style="height:12px;width:40%"></div><div class="sk" style="height:22px;width:70%"></div><div class="sk" style="height:12px;width:90%"></div></div></div></div>
  <div class="grid g-2 mb4"><div class="card"><div class="card-h"><h3>Data table & leaderboard rows</h3></div><div class="table-wrap"><table class="t"><thead><tr><th>#</th><th>Δ</th><th>Team</th><th class="r">Solved</th><th class="hide-m">FB</th><th class="hide-m">Last</th><th class="r">Points</th></tr></thead><tbody>${sbRows(LIVE.slice(0,4))}</tbody></table></div></div>
  <div class="card"><div class="card-h"><h3>Charts</h3><span class="xs muted">single hue · hover for values</span></div><div class="card-b">${areaChart([3,5,4,7,6,9,8,11],['M','T','W','T','F','S','S','M'],{h:120})}<div class="mt4">${hbars([['Web',41],['Crypto',36],['Forensics',33]])}</div></div></div></div>
  <div class="grid g-3"><div class="card pad"><div class="eyebrow mb3">Overlays</div><div class="col g2">${btn('Open modal',{cls:'outline',on:"modal('Modal title','Body copy explaining the action and its consequences.',btn('Cancel',{cls:'ghost',on:'closeModal()'})+btn('Confirm',{cls:'primary',on:'closeModal()'}))"})}${btn('Confirmation dialog',{cls:'outline',on:"confirmDlg('Delete challenge?','This cannot be undone.','Delete',()=>toast('Deleted','info'))"})}${btn('Toast',{cls:'outline',on:"toast('Saved successfully')"})}${btn('Command search ⌘K',{cls:'outline',on:'cmdK()'})}</div></div><div class="card">${empty('layers','Empty state','Explain why it is empty and what to do next.',btn('Primary action',{cls:'outline sm'}))}</div><div class="card pad"><div class="eyebrow mb3">Tabs</div>${tabs([['a','Overview'],['b','Rules',2],['c','FAQ']],'a','(()=>0)')}<div class="eyebrow mt6 mb3">Progress</div><div class="bar"><i style="width:62%"></i></div><div class="bar ok mt2"><i style="width:100%"></i></div></div></div></div>`;
}};

/* ---------- init ---------- */
function boot(){
  if(!document.getElementById('root')) return;
  const h=location.hash.slice(1);
  if(h&&!R[h]&&!PREFIX.some(([p])=>h.startsWith(p))){ /* unknown */ }
  render();
  document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); cmdK(); } });
}
boot();
</script></body></html>
